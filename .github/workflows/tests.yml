name: API and UI Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API and project smoke tests
        env:
          AE_GUEST_AUTH: ${{ secrets.AE_GUEST_AUTH }}
        run: |
          rm -rf allure-results
          pytest tests/api tests/test_smoke.py -v --alluredir=allure-results

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: allure-results/
          if-no-files-found: warn

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests
        run: |
          rm -rf allure-results
          pytest tests/ui -v --alluredir=allure-results

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: allure-results/
          if-no-files-found: warn

  allure-report:
    if: always()

    needs:
      - api-tests
      - ui-tests

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-allure-results'
          path: allure-results
          merge-multiple: true

      - name: Set Allure environment
        run: |
          python - <<'PY'
          import platform
          from pathlib import Path

          environment = Path("allure-results/environment.properties")
          environment.parent.mkdir(parents=True, exist_ok=True)

          data = [
              "Project=American Eagle Python Automation",
              "Environment=Production",
              f"Language=Python {platform.python_version()}",
              "Framework=Pytest",
              "HTTP_Client=requests",
              "UI_Automation=Selenium WebDriver",
              "Browser=Google Chrome (UI job)",
              f"Report_OS={platform.system()} {platform.release()}",
              "CI=GitHub Actions",
              "Site=American Eagle",
          ]

          environment.write_text(
              "\n".join(data) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Copy history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Build Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
