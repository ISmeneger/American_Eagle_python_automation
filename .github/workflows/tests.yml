name: API and UI Automation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        env:
          AE_GUEST_AUTH: ${{ secrets.AE_GUEST_AUTH }}
        run: |
          pytest tests/api -v

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: allure-results/
          if-no-files-found: warn

  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests
        run: |
          pytest tests/ui -v

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: allure-results/
          if-no-files-found: warn

  allure-report:
    if: always()

    needs:
      - api-tests
      - ui-tests

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download API Allure results
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results
          path: allure-results/api

      - name: Download UI Allure results
        uses: actions/download-artifact@v4
        with:
          name: ui-allure-results
          path: allure-results/ui

      - name: Merge Allure results
        run: |
          mkdir -p merged-allure-results
          cp -r allure-results/api/. merged-allure-results/
          cp -r allure-results/ui/. merged-allure-results/

      - name: Copy history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Build Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: merged-allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history