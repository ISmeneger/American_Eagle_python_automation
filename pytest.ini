[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
addopts = -v

markers =
    ui: UI tests
    api: API tests
    account: Account-related UI tests
    home_page: Home page UI tests
    auth: Authentication API tests
    browse: Browse API tests
    inventory: Inventory API tests
    bag: Bag API tests
    smoke: Critical smoke tests
    negative: Negative test scenarios
    positive: Positive test scenarios
    defect: Known defect scenarios